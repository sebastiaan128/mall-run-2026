name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # De Firebase-configuratie zit niet in de code maar in .env, en dat
      # bestand staat niet in de repo. Zonder deze secrets bouwt Vite een
      # bundel met lege sleutels: initializeApp klapt dan bij het laden en de
      # bezoeker ziet een witte pagina. Daarom eerst controleren, zodat een
      # kapotte build nooit live gaat.
      - name: Controleer dat de Firebase-configuratie beschikbaar is
        run: |
          if [ -z "${VITE_FIREBASE_API_KEY}" ]; then
            echo "VITE_FIREBASE_* secrets ontbreken in deze repository." >&2
            echo "Zet ze onder Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      - run: npm ci && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MALL_RUN_B5FF6 }}
          projectId: mall-run-b5ff6
